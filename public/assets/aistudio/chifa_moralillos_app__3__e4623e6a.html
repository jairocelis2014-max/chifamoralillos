      const [productToDelete, setProductToDelete] = useState(null);

      const cartSubtotal = useMemo(() => cart.reduce((acc, item) => acc + (item.price * item.quantity), 0), [cart]);

      const handleAddToCart = (product, quantity = 1) => {
        setCart(prevCart => {
          const existingIndex = prevCart.findIndex(item => item.id === product.id);
          if (existingIndex > -1) {
            const updated = [...prevCart];
            updated[existingIndex].quantity += quantity;
            return updated;
          } else {
            return [...prevCart, { ...product, quantity }];
          }
        });
        setDetailQuantity(1);
      };

      const updateCartQuantity = (productId, delta) => {
        setCart(prevCart => prevCart.map(item => {
          if (item.id === productId) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const openProductDetail = (product) => {
        setDetailProduct(product);
        setDetailQuantity(1);
      };

      const handleSendWhatsAppOrder = (e) => {
        if (e) e.preventDefault();
        setFormError('');

        if (!customerName.trim() || !customerPhone.trim()) {
          setFormError("Por favor completa tu Nombre y Número de teléfono.");
          return;
        }
        if (!locationDetails.trim()) {
          setFormError("Por favor especifica la información de entrega (Dirección, Hora de recojo o N° de Mesa).");
          return;
        }

        const newOrder = {
          id: `ORD-${1000 + orders.length + 1}`,
          date: new Date().toISOString(),
          customerName,
          customerPhone,
          serviceType,
          locationDetails,
          paymentMethod,
          status: "Pendiente",
          total: cartSubtotal,
          items: cart.map(i => ({ name: i.name, quantity: i.quantity, price: i.price }))

        setOrders([newOrder, ...orders]);

        let itemsText = cart.map(item => `• *${item.name}* x${item.quantity} = S/. ${(item.price * item.quantity).toFixed(2)}`).join('\n');
        
        let paymentDesc = paymentMethod === 'Efectivo_Contraentrega'

                            <input 
                              type="file" 
                              accept="image/*"
                              onChange={(e) => setProofFile(e.target.files ? e.target.files[0] : null)}
                              className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                            />
                            <div className="flex items-center justify-center gap-2 text-gray-300 text-[11px]">
                              <Icon name="upload" className="w-4 h-4 text-purple-400" />
                              <span className="truncate">{proofFile ? proofFile.name : 'Subir foto o captura del voucher'}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div>
                  <label className="block text-gray-300 font-semibold mb-1">Nombre Completo</label>
                  <input
                    type="text"
                    required
                    placeholder="Ej: Juan Pérez"
                    value={customerName}
                    onChange={(e) => setCustomerName(e.target.value)}
                    className="w-full bg-[#241f21] text-white p-3 rounded-xl border border-gray-800 focus:outline-none focus:border-amber-400"
                  />
                </div>

                <div>
                  <label className="block text-gray-300 font-semibold mb-1">Número de Teléfono</label>
                  <input
                    type="tel"
                    required
                    placeholder="Ej: 941428121"
                    value={customerPhone}
                    onChange={(e) => setCustomerPhone(e.target.value)}
                    className="w-full bg-[#241f21] text-white p-3 rounded-xl border border-gray-800 focus:outline-none focus:border-amber-400"
                  />
                </div>

                <div>
                  <label className="block text-gray-300 font-semibold mb-1">Observaciones / Indicaciones</label>
                  <textarea
                    rows="2"
                    placeholder="Ej: Sin cebollita china, chaufa bien salteado..."
                    value={observations}
                    onChange={(e) => setObservations(e.target.value)}
                    className="w-full bg-[#241f21] text-white p-3 rounded-xl border border-gray-800 focus:outline-none focus:border-amber-400"
                  />
                </div>

                <div className="space-y-2 pt-2">
                  <button
                    type="submit"
                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3.5 rounded-xl flex items-center justify-center gap-2 shadow-lg transition text-xs"
                  >
                    <Icon name="message-circle" className="w-4 h-4" />
                    <span>Realizar Pedido mediante WhatsApp</span>
                  </button>

                  <div className="flex gap-2">
                    <a
                      href={`tel:${INITIAL_DATA.restaurantInfo.mobile}`}
                      className="flex-1 bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl flex items-center justify-center gap-2 shadow transition text-xs"
                    >
                      <Icon name="phone" className="w-4 h-4" />
                      <span>Llamada Directa</span>
                    </a>

                    <button
                      type="button"
                      onClick={() => setIsCheckoutOpen(false)}
                      className="bg-[#252022] hover:bg-[#312a2c] text-gray-300 font-semibold px-4 py-3 rounded-xl border border-gray-700 transition"
                    >
                      Cancelar
                    </button>
                  </div>
                </div>

              </form>
            </div>
          </div>
        )}

        {/* MODAL ADMIN LOGIN */}
        {showLoginModal && (
          <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
            <div className="bg-[#181516] rounded-2xl w-full max-w-sm border border-gray-800 p-6 space-y-4 shadow-2xl relative">
              <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white">
                <Icon name="x" className="w-5 h-5" />
              </button>

              <div className="text-center space-y-1">
                <div className="w-12 h-12 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto border border-amber-500/40">
                  <Icon name="user-check" className="w-6 h-6" />
                </div>
                <h3 className="font-bold text-white text-lg">Panel de Administración</h3>
                <p className="text-xs text-gray-400">Control de platos, precios y ordenes del Chifa</p>
              </div>

              {loginError && (
                <div className="bg-red-950/80 border border-red-800 text-red-300 p-2.5 rounded-xl text-xs text-center font-semibold">
                  {loginError}
                </div>
              )}

              <form onSubmit={handleAdminLogin} className="space-y-3 text-xs">
                <div>
                  <label className="block text-gray-300 font-semibold mb-1">Usuario</label>
                  <input
                    type="text"
                    required
                    placeholder="admin"
                    value={adminUser}
                    onChange={(e) => setAdminUser(e.target.value)}
                    className="w-full bg-[#241f21] text-white p-3 rounded-xl border border-gray-800 focus:outline-none focus:border-amber-400"
                  />
                </div>

                <div>
                  <label className="block text-gray-300 font-semibold mb-1">Contraseña</label>
                  <input
                    type="password"
                    required
                    placeholder="admin"
                    value={adminPass}
                    onChange={(e) => setAdminPass(e.target.value)}
                    className="w-full bg-[#241f21] text-white p-3 rounded-xl border border-gray-800 focus:outline-none focus:border-amber-400"
                  />
                </div>

                <div className="bg-amber-950/40 p-2.5 rounded-xl border border-amber-900/40 text-[10px] text-amber-300 text-center">
                  🔑 Credenciales por defecto: <strong>admin</strong> / <strong>admin</strong>
                </div>

                <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl shadow-lg transition">
                  Acceder al Dashboard
                </button>
              </form>
            </div>
          </div>
        )}

        {/* MODAL AGREGAR/EDITAR PRODUCTO */}
        {showProductModal && (
          <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
            <div className="bg-[#181516] rounded-2xl w-full max-w-md border border-gray-800 p-6 space-y-4 shadow-2xl relative">
              <button onClick={() => setShowProductModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white">
                <Icon name="x" className="w-5 h-5" />
              </button>

              <h3 className="font-bold text-white text-lg border-b border-gray-800 pb-2">
                {editingProduct ? 'Editar Plato o Combo' : 'Nuevo Plato para el Menú'}
              </h3>

              <form onSubmit={handleSaveProduct} className="space-y-3 text-xs">
                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="block text-gray-300 font-semibold mb-1">Código</label>
                    <input
                      type="text"
                      placeholder="Ej: G1"
                      value={productForm.id}
                      onChange={(e) => setProductForm({ ...productForm, id: e.target.value })}
                      className="w-full bg-[#241f21] text-white p-3 rounded-xl border border-gray-800"
                    />
                  </div>
                  <div className="col-span-2">
                    <label className="block text-gray-300 font-semibold mb-1">Nombre del Plato</label>
                    <input
                      type="text"
                      required
                      placeholder="Ej: Chaufa Especial"
                      value={productForm.name}
                      onChange={(e) => setProductForm({ ...productForm, name: e.target.value })}
                      className="w-full bg-[#241f21] text-white p-3 rounded-xl border border-gray-800"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-gray-300 font-semibold mb-1">Categoría</label>
                    <select
                      value={productForm.categoryId}
                      onChange={(e) => setProductForm({ ...productForm, categoryId: e.target.value })}
                      className="w-full bg-[#241f21] text-white p-3 rounded-xl border border-gray-800"
                    >
                      {INITIAL_DATA.categories.map((c) => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-gray-300 font-semibold mb-1">Precio (S/.)</label>
                    <input
                      type="number"
                      step="0.5"
                      required
                      placeholder="23.00"
                      value={productForm.price}
                      onChange={(e) => setProductForm({ ...productForm, price: e.target.value })}
                      className="w-full bg-[#241f21] text-white p-3 rounded-xl border border-gray-800"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-gray-300 font-semibold mb-1">Descripción / Ingredientes</label>
                  <textarea
                    rows="2"
                    placeholder="Arroz chaufa con pollo, chancho y langostinos"
                    value={productForm.description}
                    onChange={(e) => setProductForm({ ...productForm, description: e.target.value })}
                    className="w-full bg-[#241f21] text-white p-3 rounded-xl border border-gray-800"
                  />
                </div>

                <div className="flex gap-2 pt-2">
                  <button type="submit" className="flex-1 bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl shadow-lg transition">
                    Guardar Plato
                  </button>
                  <button type="button" onClick={() => setShowProductModal(false)} className="bg-[#252022] hover:bg-[#312a2c] text-gray-300 font-semibold px-4 py-3 rounded-xl transition">
                    Cancelar
                  </button>
                </div>
              </form>
            </div>
          </div>
        )}

        {/* MODAL CONFIRMACIÓN ELIMINAR */}
        {productToDelete && (
          <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
            <div className="bg-[#181516] rounded-2xl w-full max-w-sm border border-gray-800 p-6 space-y-4 shadow-2xl relative">
              <div className="flex flex-col items-center text-center space-y-2">
                <div className="w-12 h-12 rounded-full bg-red-950/80 text-red-400 border border-red-800 flex items-center justify-center">
                  <Icon name="alert-triangle" className="w-6 h-6" />
                </div>
                <h3 className="font-extrabold text-white text-lg">¿Eliminar este plato?</h3>
                <p className="text-xs text-gray-400">
                  Se eliminará <span className="text-amber-400 font-bold">"{productToDelete.name}"</span> de la carta.
                </p>
              </div>

              <div className="flex gap-3 pt-2">
                <button
                  onClick={confirmDeleteProduct}
                  className="flex-1 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs py-3 rounded-xl shadow-lg transition"
                >
                  Sí, Eliminar
                </button>
                <button
                  onClick={() => setProductToDelete(null)}
                  className="flex-1 bg-[#252022] hover:bg-[#312a2c] text-gray-300 font-bold text-xs py-3 rounded-xl border border-gray-700 transition"
                >
                  Cancelar
                </button>
              </div>
            </div>
          </div>
        )}

      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  </script>
</body>
</html>
